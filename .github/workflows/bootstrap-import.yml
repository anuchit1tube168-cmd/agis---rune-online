name: Bootstrap Rune Online v2.6.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-rune-v2-6-0
  cancel-in-progress: false

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AGIS repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream v2.6.0 snapshot
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.6.0 https://github.com/natthphong/rune-online.git /tmp/rune-upstream
          git -C /tmp/rune-upstream rev-parse HEAD | tee /tmp/upstream-sha

      - name: Import source and assets without touching upstream
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/bootstrap-import.yml' \
            /tmp/rune-upstream/ ./
          mkdir -p agis
          cp /tmp/upstream-sha agis/UPSTREAM_COMMIT.txt
          printf '%s\n' 'Source imported from natthphong/rune-online tag v2.6.0 by AGIS bootstrap workflow.' > agis/UPSTREAM_SOURCE.txt

      - name: Commit imported baseline
        run: |
          set -euo pipefail
          git config user.name 'AGIS Bootstrap Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: import Rune Online v2.6.0 baseline'
          git push origin HEAD:main
