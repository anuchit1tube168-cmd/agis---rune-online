name: AGIS Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# จำกัด GITHUB_TOKEN ให้อ่านอย่างเดียว เพื่อลดความเสียหายถ้ามีโค้ดแปลกปลอมรันใน workflow
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify AGIS snapshot and content catalog
        run: python3 scripts/verify-agis.py
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (v4.3.0)
        with:
          version: '12.14.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Tests
        run: pnpm test
      - name: Build client
        run: pnpm build
