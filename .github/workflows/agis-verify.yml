name: AGIS Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify AGIS snapshot and content catalog
        run: python3 scripts/verify-agis.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Tests
        run: pnpm test
      - name: Build client
        run: pnpm build
